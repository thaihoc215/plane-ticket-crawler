# Enable Java 21 Virtual Threads for all Spring-managed tasks (web, scheduling, async)
spring.threads.virtual.enabled=true

# Application name
spring.application.name=plane-ticket-crawler

# Jackson: pretty-print JSON responses
spring.jackson.serialization.indent-output=true

# Scheduling – how often to check active alerts (default: 1 hour = 3 600 000 ms)
alert.watcher.fixed-rate-ms=3600000

# Mail (configure per-environment or via environment variables)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging
logging.level.com.planecrawler=INFO
